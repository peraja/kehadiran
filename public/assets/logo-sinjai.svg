<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#029fe4" />
      <stop offset="100%" stop-color="#0069b4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ffa500" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Shield Base -->
  <g filter="url(#shadow)">
    <path d="M 100 10 C 140 10, 185 25, 185 70 C 185 145, 150 195, 100 225 C 50 195, 15 145, 15 70 C 15 25, 60 10, 100 10 Z" 
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Gold Inner Border -->
  <path d="M 100 20 C 135 20, 175 33, 175 73 C 175 138, 143 183, 100 210 C 57 183, 25 138, 25 73 C 25 33, 65 20, 100 20 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Mountain / Nature Element -->
  <polygon points="100,75 145,145 55,145" fill="#1b4d3e" />
  <polygon points="100,75 125,145 75,145" fill="#2ecc71" opacity="0.6" />

  <!-- Sea Waves (3 waves) -->
  <path d="M 30 145 C 50 140, 70 150, 100 145 C 130 140, 150 150, 170 145 L 170 170 C 145 185, 125 190, 100 190 C 75 190, 55 185, 30 170 Z" 
        fill="#0055a5"/>
  <path d="M 35 155 C 55 150, 75 160, 100 155 C 125 150, 145 160, 165 155" 
        fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Yellow Star at Top -->
  <polygon points="100,30 104,42 117,42 106,50 110,62 100,54 90,62 94,50 83,42 96,42" 
           fill="url(#goldGrad)"/>

  <!-- Rice & Cotton Garland (Left & Right) -->
  <!-- Left Rice -->
  <circle cx="50" cy="85" r="4" fill="#ffd700"/>
  <circle cx="45" cy="98" r="4" fill="#ffd700"/>
  <circle cx="43" cy="112" r="4" fill="#ffd700"/>
  <circle cx="46" cy="126" r="4" fill="#ffd700"/>

  <!-- Right Cotton -->
  <circle cx="150" cy="85" r="5" fill="#ffffff" stroke="#ccc"/>
  <circle cx="155" cy="98" r="5" fill="#ffffff" stroke="#ccc"/>
  <circle cx="157" cy="112" r="5" fill="#ffffff" stroke="#ccc"/>
  <circle cx="154" cy="126" r="5" fill="#ffffff" stroke="#ccc"/>

  <!-- Ribbon BERSATU -->
  <g transform="translate(0, 10)">
    <path d="M 40 185 Q 100 200 160 185 L 165 200 Q 100 215 35 200 Z" fill="#e74c3c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="100" y="200" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">BERSATU</text>
  </g>

  <!-- Title Text SINJAI -->
  <text x="100" y="175" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.8))">SINJAI</text>
</svg>
